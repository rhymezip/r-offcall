name: Bug report
description: Report a reproducible problem in r-offcall.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include room passwords, private IP addresses, recordings, or personal data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which version, commit, or release are you running?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS desktop app
        - Windows desktop app
        - Linux desktop app
        - Browser client
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start host...
        2. Join from...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove private addresses, names, passwords, and recordings first.
